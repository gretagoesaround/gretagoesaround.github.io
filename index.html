<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guide semplici e pratiche dove ti racconto i miei viaggi.">
    <title>@gretagoesaround — Guide di viaggio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --ink: #35271f;
            --accent: #d97838;
            --accent-hover: #b85d27;
            --muted: #8c705e;
            --footer: #c7a58d;
            --background: #fff9f4;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--background);
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 800px; width: 100%; text-align: center; }
        .photo {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 40%;
            border: 4px solid var(--accent);
            display: block;
            margin: 0 auto 35px;
        }
        .line, .line-bottom {
            width: 90px;
            height: 3px;
            background: var(--accent);
            margin-left: auto;
            margin-right: auto;
            border-radius: 3px;
        }
        .line { margin-bottom: 35px; }
        h1 {
            font-size: 64px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--ink);
        }
        h2 {
            margin-top: 15px;
            font-size: 24px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        .tagline {
            margin: 35px auto;
            max-width: 650px;
            color: var(--muted);
            font-size: 22px;
            font-style: italic;
            line-height: 1.6;
        }
        .line-bottom { margin-bottom: 45px; }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }
        .button {
            background: var(--accent);
            color: white;
            text-decoration: none;
            padding: 16px 34px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all .25s ease;
            display: inline-block;
            min-width: 180px;
        }
        .button:hover { background: var(--accent-hover); transform: translateY(-2px); }
        .button:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
        footer {
            margin-top: 60px;
            color: var(--footer);
            font-size: 14px;
            letter-spacing: 1px;
        }
        @media (max-width: 768px) {
            .photo { width: 150px; height: 150px; }
            h1 { font-size: 42px; }
            h2 { font-size: 18px; letter-spacing: 3px; }
            .tagline { font-size: 18px; }
            .buttons { flex-direction: column; align-items: center; }
            .button { width: 220px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <img src="foto.jpg" alt="Foto di Greta" class="photo">
        <div class="line"></div>
        <h1>@gretagoesaround</h1>
        <h2>Guide di viaggio</h2>
        <p class="tagline">guide semplici e pratiche dove ti racconto i miei viaggi</p>
        <div class="line-bottom"></div>
        <div class="buttons">
            <a class="button" href="cracovia.pdf" target="_blank" rel="noopener noreferrer">2 GIORNI A CRACOVIA</a>
        </div>
        <footer>© @GRETAGOESAROUND</footer>
    </main>
</body>
</html>
