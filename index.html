<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Guide semplici e pratiche dove ti racconto i miei viaggi.">
  <title>FOTO — @gretagoesaround</title>
  <style>
    :root { --bg:#fffaf5; --ink:#30251e; --orange:#c86f35; --soft:#f3dfcd; --line:#e7c8ad; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Georgia,'Times New Roman',serif; }
    main { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:76px 22px 42px; }
    header { text-align:center; max-width:620px; }
    h1 { font-size:clamp(3.3rem,12vw,6rem); font-weight:400; letter-spacing:.04em; margin:0 0 12px; }
    .dash { color:var(--orange); font-size:1.4rem; margin:10px 0; }
    .handle { font-size:clamp(1.35rem,4vw,2rem); margin:0; font-weight:400; }
    .tagline { margin:14px 0 0; font-family:Arial,sans-serif; font-size:.95rem; line-height:1.7; color:#766254; }
    .guides { width:min(100%,560px); margin:62px auto 0; }
    .eyebrow { text-align:center; color:var(--orange); font: .72rem/1.5 Arial,sans-serif; letter-spacing:.16em; margin-bottom:18px; }
    .guide { display:block; text-decoration:none; color:inherit; border:1px solid var(--line); background:#fff5eb; padding:25px 25px 23px; transition:transform .2s, background .2s; }
    .guide:hover { transform:translateY(-3px); background:#f8e8d9; }
    .guide small { color:var(--orange); font: .72rem Arial,sans-serif; letter-spacing:.13em; }
    .guide h2 { font-size:1.65rem; font-weight:400; margin:12px 0 8px; }
    .guide p { margin:0; color:#786554; font: .9rem/1.55 Arial,sans-serif; }
    .button { margin-top:22px; display:inline-block; border:1px solid var(--orange); padding:12px 18px; color:#fff; background:var(--orange); font: .75rem Arial,sans-serif; letter-spacing:.08em; }
    footer { margin-top:auto; padding-top:75px; color:#b39a83; font: .7rem Arial,sans-serif; letter-spacing:.08em; text-align:center; }
    @media (max-width:480px) { main {padding-top:56px;} .guides{margin-top:45px;} .guide{padding:21px;} }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>FOTO</h1>
      <div class="dash">—</div>
      <p class="handle">@gretagoesaround</p>
      <div class="dash">—</div>
      <p class="tagline">guide semplici e pratiche dove ti racconto i miei viaggi</p>
    </header>

    <section class="guides" aria-label="Le mie guide di viaggio">
      <div class="eyebrow">GUIDE DI VIAGGIO</div>
      <a class="guide" href="cracovia.pdf" target="_blank" rel="noopener">
        <small>POLONIA · CITY BREAK</small>
        <h2>2 GIORNI A CRACOVIA</h2>
        <p>Una guida pratica per non annoiarsi in una città (relativamente) tranquilla.</p>
        <span class="button">SCOPRI LA GUIDA ↗</span>
      </a>
    </section>
    <footer>FOTO · @GRETAGOESAROUND</footer>
  </main>
</body>
</html>
